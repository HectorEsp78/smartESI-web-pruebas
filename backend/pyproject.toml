[project]
name = "smartesi-stats-backend"
version = "0.1.0"
description = "Backend for the Smart ESI statistics module (new charts prototype)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.1",
]

[project.optional-dependencies]
# Dependencies only needed once DATA_SOURCE=database is enabled (real Home Assistant DB).
database = [
    "sqlalchemy>=2.0.29",
    "aiomysql>=0.2.0",
    "greenlet>=3.0.0",
]
test = [
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
