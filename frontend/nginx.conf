server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS, so nginx can start before the backend container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host backend;

    location /api/ {
        proxy_pass http://$backend_host:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Keep the readiness/liveness probes reachable through the public port.
    location /health/ {
        proxy_pass http://$backend_host:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Long-lived assets are fingerprinted by Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
