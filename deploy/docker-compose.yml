name: smartesi-stats

services:
  backend:
    build:
      context: ../backend
    env_file:
      - .env
    environment:
      # Public origin allowed by CORS; the browser talks to nginx, not to this
      # container directly.
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8080}
      APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "${BACKEND_PORT:-8010}:8010"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/ready', timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: ../frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
